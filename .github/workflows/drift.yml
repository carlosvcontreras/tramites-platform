# Detección de drift: compara lo que dice Terraform con lo que existe en GCP.
# Si alguien cambió algo desde la consola, el plan sale con cambios (exit code 2)
# y se abre un issue en el repo.
name: drift

on:
  schedule:
    - cron: "0 13 * * *" # todos los días 13:00 UTC = 7:00am El Salvador
  workflow_dispatch: {} # botón "Run workflow" para probarlo a mano

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: ${{ vars.PROJECT_ID }}
      TF_VAR_region: ${{ vars.REGION }}
      TF_VAR_billing_account: ${{ vars.BILLING_ACCOUNT }}
      TF_VAR_github_repo: ${{ github.repository }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v7

      # SA ci-drift: solo lectura. No puede aplicar nada.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DRIFT_SA }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false # para leer el exit code real

      - name: terraform plan
        id: plan
        working-directory: infra
        run: |
          terraform init -input=false -backend-config="bucket=$TF_VAR_state_bucket"
          set +e
          # -detailed-exitcode: 0 = sin cambios, 1 = error, 2 = hay drift
          # -lock=false: la SA de solo lectura no puede escribir el lock
          terraform plan -detailed-exitcode -lock=false -input=false -no-color > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Abrir issue si hay drift
        if: steps.plan.outputs.exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "El plan programado encontró diferencias entre Terraform y GCP."
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            tail -n 150 infra/plan.txt
            echo '```'
          } > body.md
          gh issue create --title "Drift detectado $(date -u +%F)" --body-file body.md
          exit 1 # el workflow queda en rojo además del issue
